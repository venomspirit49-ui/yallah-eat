name: Yallah Eat APK
on: workflow_dispatch
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Build APK
        run: |
          unzip -q Yallah-Eat-Android.zip -d source
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cd source/Yallah-Eat-Android
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Yallah-Eat-APK
          path: source/Yallah-Eat-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
